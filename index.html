<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyForge — Turn notes into study guides</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b;
    --border:#2a2f3a; --text:#eceae3; --muted:#8b90a0;
    --accent:#4f9dff; --accent2:#7bd0c9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;
  }
  a{color:var(--accent);}
  .hero{
    padding:4rem 1.5rem 3rem; text-align:center;
    border-bottom:1px solid var(--border);
    background:radial-gradient(ellipse at top, rgba(79,157,255,0.08), transparent 60%);
  }
  .hero h1{ font-family:Georgia,serif; font-size:2.8rem; margin:0; letter-spacing:.5px;}
  .hero h1 span{color:var(--accent);}
  .hero p{ color:var(--muted); margin:.9rem auto 0; font-size:1.1rem; max-width:480px; line-height:1.5;}
  .badge{
    display:inline-block; margin-top:1.2rem; font-size:.78rem;
    color:var(--accent2); border:1px solid var(--border);
    background:var(--panel); padding:.35rem .8rem; border-radius:20px;
  }
  .wrap{max-width:820px; margin:0 auto; padding:3rem 1.5rem 4rem;}
  .auth-card, .input-card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:1.5rem; max-width:420px; margin:2rem auto;
  }
  .input-card{max-width:none; margin:0;}
  input[type=email], input[type=password]{
    width:100%; background:var(--panel2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); padding:.7rem .9rem;
    margin-top:.6rem; font-size:.95rem; font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--accent);}
  textarea{
    width:100%; min-height:170px; background:var(--panel2);
    border:1px solid var(--border); border-radius:10px;
    color:var(--text); padding:1rem; font-size:.95rem;
    resize:vertical; font-family:inherit;
  }
  textarea:focus{outline:none; border-color:var(--accent);}
  select{
    margin-top:.8rem; background:var(--panel2); color:var(--text);
    border:1px solid var(--border); border-radius:8px;
    padding:.55rem .7rem; font-size:.9rem; font-family:inherit;
  }
  .row{display:flex; justify-content:space-between; align-items:center; margin-top:1rem;}
  button{
    background:var(--accent); color:#0f1115; border:none;
    padding:.8rem 1.8rem; border-radius:8px; font-size:1rem;
    cursor:pointer; font-weight:700; transition:opacity .15s, transform .1s;
  }
  button:hover{opacity:.9;}
  button:active{transform:scale(.98);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-full{width:100%; margin-top:1rem;}
  .btn-ghost{
    background:transparent; border:1px solid var(--border); color:var(--text);
  }
  #status, #authStatus{color:var(--muted); font-size:.9rem;}
  #authError{color:#e07b7b; font-size:.85rem; margin-top:.6rem;}

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:1rem 1.5rem; border-bottom:1px solid var(--border);
    max-width:820px; margin:0 auto;
  }
  .topbar span{font-size:.85rem; color:var(--muted);}
  .topbar button{padding:.5rem 1rem; font-size:.85rem;}

  .empty{
    text-align:center; color:var(--muted); padding:3rem 1rem;
    border:1px dashed var(--border); border-radius:14px; margin-top:2rem;
    font-size:.95rem;
  }
  .section{margin-top:2.5rem; animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .section-title{
    font-family:Georgia,serif; font-size:1.4rem; margin-bottom:1rem;
    display:flex; align-items:center; gap:.5rem;
  }
  .section-title::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--accent);}
  .guide-card{
    background:var(--panel); border:1px solid var(--border);
    border-radius:12px; padding:1.2rem 1.5rem; margin-bottom:1rem;
  }
  .guide-card h3{margin:0 0 .6rem; color:var(--accent2); font-size:1.05rem;}
  .guide-card ul{margin:0; padding-left:1.2rem; color:#d7d5cd;}
  .guide-card li{margin-bottom:.4rem; line-height:1.5;}
  .cards-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:1rem;
  }
  .flip-card{background:transparent; height:150px; perspective:1000px; cursor:pointer;}
  .flip-inner{
    position:relative; width:100%; height:100%;
    transition:transform .5s; transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute; width:100%; height:100%; backface-visibility:hidden;
    border-radius:12px; border:1px solid var(--border);
    padding:1rem; display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:.95rem; line-height:1.4;
  }
  .flip-front{background:var(--panel2); color:var(--text);}
  .flip-back{background:var(--accent); color:#0f1115; transform:rotateY(180deg); font-weight:600;}
  .flip-hint{position:absolute; bottom:8px; right:10px; font-size:.65rem; color:var(--muted);}
  .flip-back .flip-hint{color:#0f1115; opacity:.5;}
  .spinner{
    width:16px; height:16px; border:2px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    display:inline-block; animation:spin .7s linear infinite; margin-right:6px;
    vertical-align:-3px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{
    text-align:center; padding:2rem 1.5rem; color:var(--muted);
    font-size:.85rem; border-top:1px solid var(--border);
  }
  .upgrade-card{
    background:var(--panel); border:1px solid var(--accent);
    border-radius:14px; padding:2rem; text-align:center; margin-top:2rem;
  }
  .upgrade-card h3{font-family:Georgia,serif; font-size:1.4rem; margin:0 0 .5rem;}
  .upgrade-card p{color:var(--muted); margin:0 0 1.2rem;}
  .hidden{display:none;}
  @media (max-width:600px){ .hero h1{font-size:2.1rem;} }
</style>
</head>
<body>

<div id="authScreen">
  <div class="hero">
    <h1>Study<span>Forge</span></h1>
    <p>Paste messy notes. Get a clean study guide and flashcards in seconds.</p>
    <span class="badge">Powered by AI · 3 free generations</span>
  </div>
  <div class="auth-card">
    <div id="loginForm">
      <input type="email" id="email" placeholder="you@email.com">
      <input type="password" id="password" placeholder="Password">
      <button class="btn-full" id="loginBtn">Log in</button>
      <button class="btn-full btn-ghost" id="showSignup">Create an account</button>
      <div id="authError"></div>
    </div>
    <div id="signupForm" class="hidden">
      <input type="email" id="signupEmail" placeholder="you@email.com">
      <input type="password" id="signupPassword" placeholder="Create a password">
      <button class="btn-full" id="signupBtn">Sign up</button>
      <button class="btn-full btn-ghost" id="showLogin">Back to log in</button>
      <div id="signupError"></div>
    </div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <div class="topbar">
    <span id="userEmail"></span>
    <button id="logoutBtn" class="btn-ghost">Log out</button>
  </div>

  <div class="wrap">
    <div class="input-card">
      <textarea id="notesInput" placeholder="Paste your lecture notes here..."></textarea>
      <br>
      <select id="detailLevel">
        <option value="quick">Quick summary</option>
        <option value="standard" selected>Standard</option>
        <option value="detailed">Detailed / in-depth</option>
      </select>
      <div class="row">
        <span id="status"></span>
        <button id="genBtn">Generate</button>
      </div>
    </div>

    <div id="output">
      <div class="empty">Your study guide and flashcards will appear here once you generate them.</div>
    </div>
  </div>

  <footer>StudyForge — built to make studying less painful.</footer>
</div>

<script>
const SUPABASE_URL = "https://zewjmxgqvsexnsrddmlu.supabase.co";
const SUPABASE_KEY = "sb_publishable_rz1How5fizOOzI11w_QJ3Q_rSGkhE9d";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const FREE_LIMIT = 5;
const UPGRADE_LINK = "PASTE_YOUR_LEMON_SQUEEZY_LINK_HERE";

let currentUser = null;
let currentProfile = null;

const authScreen = document.getElementById('authScreen');
const appScreen = document.getElementById('appScreen');
const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');

document.getElementById('showSignup').onclick = () => {
  loginForm.classList.add('hidden');
  signupForm.classList.remove('hidden');
};
document.getElementById('showLogin').onclick = () => {
  signupForm.classList.add('hidden');
  loginForm.classList.remove('hidden');
};

document.getElementById('signupBtn').onclick = async () => {
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const errBox = document.getElementById('signupError');
  errBox.textContent = "";
  if (!email || !password) { errBox.textContent = "Enter an email and password."; return; }

  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { errBox.textContent = error.message; return; }
  errBox.style.color = "var(--accent2)";
  errBox.textContent = "Account created. Check your email to confirm, then log in.";
};

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('authError');
  errBox.textContent = "";
  if (!email || !password) { errBox.textContent = "Enter an email and password."; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errBox.textContent = error.message; return; }
  await loadUser();
};

document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
  currentUser = null;
  currentProfile = null;
  appScreen.classList.add('hidden');
  authScreen.classList.remove('hidden');
};

async function loadUser() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  currentUser = user;

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();

  if (error) { console.error(error); return; }
  currentProfile = profile;

  document.getElementById('userEmail').textContent = user.email;
  authScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');
  renderGenerateState();
}

async function checkExistingSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await loadUser();
}
checkExistingSession();

const genBtn = document.getElementById('genBtn');
const notesInput = document.getElementById('notesInput');
const detailLevel = document.getElementById('detailLevel');
const output = document.getElementById('output');
const status = document.getElementById('status');

function renderGenerateState() {
  if (!currentProfile) return;
  if (!currentProfile.is_subscribed && currentProfile.generations_used >= FREE_LIMIT) {
    genBtn.disabled = true;
    status.textContent = "Free limit reached";
    output.innerHTML = `<div class="upgrade-card">
      <h3>You've used your 3 free generations</h3>
      <p>Upgrade to StudyForge Unlimited for unlimited study guides and flashcards.</p>
      <a href="${UPGRADE_LINK}"><button>Upgrade now</button></a>
    </div>`;
  } else {
    genBtn.disabled = false;
    const remaining = currentProfile.is_subscribed ? "Unlimited" : `${FREE_LIMIT - currentProfile.generations_used} free left`;
    status.textContent = remaining;
  }
}

genBtn.addEventListener('click', async () => {
  const notes = notesInput.value.trim();
  if (!notes) { status.textContent = "Paste some notes first."; return; }
  if (!currentProfile.is_subscribed && currentProfile.generations_used >= FREE_LIMIT) {
    renderGenerateState();
    return;
  }

  genBtn.disabled = true;
  status.innerHTML = '<span class="spinner"></span> Generating...';
  output.innerHTML = "";

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes, detail: detailLevel.value })
    });
    const data = await response.json();
    const raw = data.content.map(b => b.text || "").join("");
    const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
    renderOutput(parsed);

    if (!currentProfile.is_subscribed) {
      const newCount = currentProfile.generations_used + 1;
      await sb.from('profiles').update({ generations_used: newCount }).eq('id', currentUser.id);
      currentProfile.generations_used = newCount;
    }
    status.textContent = "";
    renderGenerateState();
  } catch (err) {
    status.textContent = "Something went wrong. Try again.";
    output.innerHTML = '<div class="empty">Your study guide and flashcards will appear here once you generate them.</div>';
    console.error(err);
  } finally {
    genBtn.disabled = currentProfile.is_subscribed ? false : currentProfile.generations_used >= FREE_LIMIT;
  }
});

function renderOutput(data) {
  let html = `<div class="section">
    <div class="section-title">Study guide</div>`;
  data.guide.forEach(sec => {
    html += `<div class="guide-card"><h3>${sec.heading}</h3><ul>`;
    sec.points.forEach(p => html += `<li>${p}</li>`);
    html += `</ul></div>`;
  });
  html += `</div>
  <div class="section">
    <div class="section-title">Flashcards</div>
    <div class="cards-grid">`;
  data.flashcards.forEach((c) => {
    html += `<div class="flip-card" onclick="this.classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-face flip-front">${c.q}<span class="flip-hint">tap to flip</span></div>
        <div class="flip-face flip-back">${c.a}<span class="flip-hint">tap to flip</span></div>
      </div>
    </div>`;
  });
  html += `</div></div>`;
  output.innerHTML = html;
}
</script>
</body>
</html>
