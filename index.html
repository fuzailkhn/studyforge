<script>
const SUPABASE_URL = "https://zewjmxgqvsexnsrddmlu.supabase.co";
const SUPABASE_KEY = "sb_publishable_rz1How5fizOOzI11w_QJ3Q_rSGkhE9d";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const FREE_LIMIT = 5;
const FREE_DOC_LIMIT = 1;
const FREE_IMG_LIMIT = 1;
const UPGRADE_LINK = "PASTE_YOUR_LEMON_SQUEEZY_LINK_HERE";

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let currentUser = null;
let currentProfile = null;
let docFile = null;      // { name, text }  -- for real text PDFs/docx/txt
let docImages = null;    // [ base64, base64, ... ] -- for scanned PDFs
let imgFile = null;      // { name, base64 } -- for direct image upload
let lastGeneratedData = null;

const authScreen = document.getElementById('authScreen');
const appScreen = document.getElementById('appScreen');
const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');

document.getElementById('showSignup').onclick = () => {
  loginForm.classList.add('hidden');
  signupForm.classList.remove('hidden');
};
document.getElementById('showLogin').onclick = () => {
  signupForm.classList.add('hidden');
  loginForm.classList.remove('hidden');
};

document.getElementById('signupBtn').onclick = async () => {
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const errBox = document.getElementById('signupError');
  errBox.textContent = "";
  if (!email || !password) { errBox.textContent = "Enter an email and password."; return; }

  const { error } = await sb.auth.signUp({ email, password });
  if (error) { errBox.textContent = error.message; return; }
  errBox.style.color = "var(--accent2)";
  errBox.textContent = "Account created. Check your email to confirm, then log in.";
};

document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('authError');
  errBox.textContent = "";
  if (!email || !password) { errBox.textContent = "Enter an email and password."; return; }

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errBox.textContent = error.message; return; }
  await loadUser();
};

document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
  currentUser = null;
  currentProfile = null;
  appScreen.classList.add('hidden');
  authScreen.classList.remove('hidden');
};

async function loadUser() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  currentUser = user;

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();

  if (error) { console.error(error); return; }
  currentProfile = profile;

  document.getElementById('userEmail').textContent = user.email;
  authScreen.classList.add('hidden');
  appScreen.classList.remove('hidden');
  renderGenerateState();
}

async function checkExistingSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await loadUser();
}
checkExistingSession();

const genBtn = document.getElementById('genBtn');
const notesInput = document.getElementById('notesInput');
const detailLevel = document.getElementById('detailLevel');
const output = document.getElementById('output');
const status = document.getElementById('status');
const docInput = document.getElementById('docInput');
const imgInput = document.getElementById('imgInput');
const docUploadBtn = document.getElementById('docUploadBtn');
const imgUploadBtn = document.getElementById('imgUploadBtn');
const docFname = document.getElementById('docFname');
const imgFname = document.getElementById('imgFname');

async function renderPdfPagesAsImages(buf, maxPages) {
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const images = [];
  const pageCount = Math.min(pdf.numPages, maxPages);
  for (let i = 1; i <= pageCount; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    images.push(canvas.toDataURL('image/jpeg', 0.85));
  }
  return images;
}

docInput.addEventListener('change', async () => {
  const file = docInput.files[0];
  if (!file) return;
  imgFile = null; imgFname.textContent = ""; imgUploadBtn.classList.remove('active');
  docFile = null; docImages = null;

  docFname.textContent = "Reading " + file.name + "...";
  try {
    if (file.name.endsWith('.pdf')) {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(it => it.str).join(' ') + '\n';
      }

      if (text.trim().length < 40) {
        docFname.textContent = "No text layer found — reading as scanned pages...";
        const images = await renderPdfPagesAsImages(buf.slice(0), 5);
        docImages = images;
        docFname.textContent = "✓ " + file.name + " (scanned, " + images.length + " page(s))";
      } else {
        docFile = { name: file.name, text: text.slice(0, 20000) };
        docFname.textContent = "✓ " + file.name;
      }
    } else if (file.name.endsWith('.docx')) {
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: buf });
      docFile = { name: file.name, text: result.value.slice(0, 20000) };
      docFname.textContent = "✓ " + file.name;
    } else {
      const text = await file.text();
      docFile = { name: file.name, text: text.slice(0, 20000) };
      docFname.textContent = "✓ " + file.name;
    }
    docUploadBtn.classList.add('active');
  } catch (err) {
    console.error(err);
    docFname.textContent = "Couldn't read this file. Try another.";
    docFile = null;
    docImages = null;
  }
});

imgInput.addEventListener('change', () => {
  const file = imgInput.files[0];
  if (!file) return;
  docFile = null; docImages = null; docFname.textContent = ""; docUploadBtn.classList.remove('active');

  const reader = new FileReader();
  reader.onload = () => {
    imgFile = { name: file.name, base64: reader.result };
    imgFname.textContent = "✓ " + file.name;
    imgUploadBtn.classList.add('active');
  };
  reader.readAsDataURL(file);
});

function renderGenerateState() {
  if (!currentProfile) return;
  const textLimitHit = !currentProfile.is_subscribed && currentProfile.generations_used >= FREE_LIMIT;
  if (textLimitHit) {
    genBtn.disabled = true;
    status.textContent = "Free limit reached";
    showUpgradeCard("You're out of free generations");
  } else {
    genBtn.disabled = false;
    const remaining = currentProfile.is_subscribed ? "Unlimited" : `${FREE_LIMIT - currentProfile.generations_used} free left`;
    status.textContent = remaining;
  }
}

function showUpgradeCard(heading) {
  output.innerHTML = `<div class="upgrade-card">
    <span class="tag">Unlock unlimited</span>
    <h3>${heading}</h3>
    <div class="price">$4.99<span>/month</span></div>
    <ul>
      <li>Unlimited study guides and flashcards</li>
      <li>Unlimited document and image uploads</li>
      <li>Download your study guides as PDF</li>
      <li>Cancel anytime</li>
    </ul>
    <a href="${UPGRADE_LINK}"><button>Upgrade now</button></a>
  </div>`;
}

genBtn.addEventListener('click', async () => {
  const pastedNotes = notesInput.value.trim();
  const isDocUpload = !!docFile || !!docImages;

  if (!pastedNotes && !isDocUpload && !imgFile) {
    status.textContent = "Paste notes, or upload a document/image first.";
    return;
  }

  if (!currentProfile.is_subscribed) {
    if (isDocUpload && currentProfile.documents_used >= FREE_DOC_LIMIT) {
      showUpgradeCard("You've used your free document upload"); return;
    }
    if (imgFile && currentProfile.images_used >= FREE_IMG_LIMIT) {
      showUpgradeCard("You've used your free image upload"); return;
    }
    if (!isDocUpload && !imgFile && currentProfile.generations_used >= FREE_LIMIT) {
      showUpgradeCard("You're out of free generations"); return;
    }
  }

  genBtn.disabled = true;
  status.innerHTML = '<span class="spinner"></span> Generating...';
  output.innerHTML = "";

  try {
    const payload = { detail: detailLevel.value };
    if (imgFile) payload.images = [imgFile.base64];
    else if (docImages) payload.images = docImages;
    else if (docFile) payload.notes = docFile.text;
    else payload.notes = pastedNotes;

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    const raw = data.content.map(b => b.text || "").join("");
    const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
    lastGeneratedData = parsed;
    renderOutput(parsed);

    if (!currentProfile.is_subscribed) {
      const updates = {};
      if (imgFile) updates.images_used = currentProfile.images_used + 1;
      else if (isDocUpload) updates.documents_used = currentProfile.documents_used + 1;
      else updates.generations_used = currentProfile.generations_used + 1;

      await sb.from('profiles').update(updates).eq('id', currentUser.id);
      Object.assign(currentProfile, updates);
    }
    status.textContent = "";
    renderGenerateState();
  } catch (err) {
    status.textContent = "Something went wrong. Try again.";
    output.innerHTML = '<div class="empty">Your study guide and flashcards will appear here once you generate them.</div>';
    console.error(err);
  } finally {
    genBtn.disabled = false;
    renderGenerateState();
  }
});

function renderOutput(data) {
  let html = `<div class="section">
    <div class="section-title">
      <span class="section-title-left">Study guide</span>
      <button class="btn-ghost btn-small" id="downloadBtn">Download PDF</button>
    </div>`;
  data.guide.forEach(sec => {
    html += `<div class="guide-card"><h3>${sec.heading}</h3><ul>`;
    sec.points.forEach(p => html += `<li>${p}</li>`);
    html += `</ul></div>`;
  });
  html += `</div>
  <div class="section">
    <div class="section-title"><span class="section-title-left">Flashcards</span></div>
    <div class="cards-grid">`;
  data.flashcards.forEach((c) => {
    html += `<div class="flip-card" onclick="this.classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-face flip-front">${c.q}<span class="flip-hint">tap to flip</span></div>
        <div class="flip-face flip-back">${c.a}<span class="flip-hint">tap to flip</span></div>
      </div>
    </div>`;
  });
  html += `</div></div>`;
  output.innerHTML = html;

  document.getElementById('downloadBtn').onclick = downloadPDF;
}

function downloadPDF() {
  if (!currentProfile.is_subscribed) {
    showUpgradeCard("Downloads are a paid feature");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(18);
  doc.text("StudyForge — Study Guide", 14, y);
  y += 12;
  doc.setFontSize(12);
  lastGeneratedData.guide.forEach(sec => {
    if (y > 270) { doc.addPage(); y = 20; }
    doc.setFont(undefined, 'bold');
    doc.text(sec.heading, 14, y); y += 7;
    doc.setFont(undefined, 'normal');
    sec.points.forEach(p => {
      const lines = doc.splitTextToSize("• " + p, 180);
      lines.forEach(line => {
        if (y > 270) { doc.addPage(); y = 20; }
        doc.text(line, 16, y); y += 6;
      });
    });
    y += 4;
  });
  doc.addPage(); y = 20;
  doc.setFontSize(16);
  doc.text("Flashcards", 14, y); y += 10;
  doc.setFontSize(11);
  lastGeneratedData.flashcards.forEach((c, i) => {
    if (y > 265) { doc.addPage(); y = 20; }
    doc.setFont(undefined, 'bold');
    const qLines = doc.splitTextToSize((i+1) + ". " + c.q, 180);
    qLines.forEach(line => { doc.text(line, 14, y); y += 6; });
    doc.setFont(undefined, 'normal');
    const aLines = doc.splitTextToSize("A: " + c.a, 176);
    aLines.forEach(line => { doc.text(line, 18, y); y += 6; });
    y += 4;
  });
  doc.save("studyforge-guide.pdf");
}
</script>
